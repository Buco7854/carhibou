name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test ./...
      - run: sh build-release.sh 0.1.0 /tmp/carhibou-agent-dist

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check backend agent
      - run: ruff format --check backend agent
      - run: mypy backend agent
      - run: pytest -m "not postgres" backend/tests agent/tests
      - name: Verify SQLite migrations
        env:
          CARHIBOU_DATABASE_URL: sqlite:////tmp/carhibou-migrations.sqlite3
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: python -m build --wheel --no-isolation

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: npm audit
        # Three back-to-back attempts each failed at exactly the 5-minute mark, which
        # is npm's own fetch-timeout default (300000ms), not registry flakiness a
        # retry would paper over: the advisories-bulk endpoint just needs longer than
        # that to answer a request this size (295 packages here vs. docs' 131, which
        # answers in under a minute). Two attempts at double the default timeout.
        run: |
          for attempt in 1 2; do
            npm audit --audit-level=high --fetch-timeout=600000 && exit 0
            echo "npm audit attempt $attempt failed; retrying..." >&2
            sleep 15
          done
          exit 1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - name: npm audit
        # Three back-to-back attempts each failed at exactly the 5-minute mark, which
        # is npm's own fetch-timeout default (300000ms), not registry flakiness a
        # retry would paper over: the advisories-bulk endpoint just needs longer than
        # that to answer a request this size (295 packages here vs. docs' 131, which
        # answers in under a minute). Two attempts at double the default timeout.
        run: |
          for attempt in 1 2; do
            npm audit --audit-level=high --fetch-timeout=600000 && exit 0
            echo "npm audit attempt $attempt failed; retrying..." >&2
            sleep 15
          done
          exit 1
      - run: npm run docs:build

  browser-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: carhibou_browser_e2e
          POSTGRES_USER: carhibou
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carhibou -d carhibou_browser_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CARHIBOU_DATABASE_URL: postgresql+psycopg://carhibou:test-password@localhost:5432/carhibou_browser_e2e
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r ../requirements-dev.lock
      - run: pip install --no-deps -e ..
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: carhibou_test
          POSTGRES_USER: carhibou
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carhibou -d carhibou_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CARHIBOU_DATABASE_URL: postgresql+psycopg://carhibou:test-password@localhost:5432/carhibou_test
      CARHIBOU_TEST_DATABASE_URL: postgresql+psycopg://carhibou:test-password@localhost:5432/carhibou_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -m postgres backend/tests/test_postgres_integration.py

  docker:
    runs-on: ubuntu-latest
    # Deliberately not gated on the test jobs: the image is built from the
    # source tree and consumes nothing they produce, so making it wait only
    # serialised the two slowest jobs in the workflow. A red test run now
    # wastes one image build, which is cheaper than the delay it replaces.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: carhibou:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose --env-file .env.example config --quiet
      - name: Smoke test image and migrations
        run: |
          docker network create carhibou-ci
          docker run -d --name carhibou-ci-postgres --network carhibou-ci -e POSTGRES_DB=carhibou -e POSTGRES_USER=carhibou -e POSTGRES_PASSWORD=test-password postgres:18.6-bookworm
          for attempt in $(seq 1 30); do
            docker exec carhibou-ci-postgres pg_isready -U carhibou -d carhibou && break
            [ "$attempt" -lt 30 ] || exit 1
            sleep 1
          done
          DATABASE_URL=postgresql+psycopg://carhibou:test-password@carhibou-ci-postgres:5432/carhibou
          docker run --rm --network carhibou-ci -e CARHIBOU_DATABASE_URL="$DATABASE_URL" carhibou:ci alembic upgrade head
          docker run -d --name carhibou-ci-app --network carhibou-ci -p 127.0.0.1:18000:8000 \
            -e CARHIBOU_DATABASE_URL="$DATABASE_URL" \
            -e CARHIBOU_BOOTSTRAP_ADMIN_EMAIL=container-owner@example.com \
            -e CARHIBOU_BOOTSTRAP_ADMIN_PASSWORD=container-bootstrap-password \
            -e CARHIBOU_BOOTSTRAP_ADMIN_DISPLAY_NAME='Container Owner' \
            carhibou:ci
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18000/health/ready && break
            [ "$attempt" -lt 30 ] || exit 1
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/vehicles | grep -q '<title>Carhibou'
          # The endpoint serves the repository's installer verbatim, so compare the
          # two rather than grepping for an internal variable name. The previous
          # assertion matched ${VERSION}, which a rename to ${AGENT_VERSION} left
          # silently unmatchable, and the smoke test failed on every commit after.
          curl --fail --silent http://127.0.0.1:18000/install-agent -o /tmp/install-agent.sh
          diff /tmp/install-agent.sh agent/installer/install-agent.sh
          sh -n /tmp/install-agent.sh
          curl --fail --silent http://127.0.0.1:18000/agent/releases/0.1.0/carhibou-agent-0.1.0-linux-amd64 -o /tmp/carhibou-agent
          chmod +x /tmp/carhibou-agent
          /tmp/carhibou-agent version | grep -q 'Carhibou agent 0.1.0 (linux-amd64)'
          curl --fail --silent -X POST http://127.0.0.1:18000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"email":"container-owner@example.com","password":"container-bootstrap-password"}' \
            | grep -q 'container-owner@example.com'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST \
            http://127.0.0.1:18000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            --data '{"email":"second@example.com","password":"second-container-password","display_name":"Second"}')" = 403
          docker run --rm --network carhibou-ci -e CARHIBOU_DATABASE_URL="$DATABASE_URL" carhibou:ci worker --once
