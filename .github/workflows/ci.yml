name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check backend agent
      - run: ruff format --check backend agent
      - run: mypy backend agent
      - run: pytest -m "not postgres" backend/tests agent/tests
      - name: Verify SQLite migrations
        env:
          VEHINODE_DATABASE_URL: sqlite:////tmp/vehinode-migrations.sqlite3
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: python -m build --wheel --no-isolation

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run docs:build

  browser-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: vehinode_browser_e2e
          POSTGRES_USER: vehinode
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vehinode -d vehinode_browser_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      VEHINODE_DATABASE_URL: postgresql+psycopg://vehinode:test-password@localhost:5432/vehinode_browser_e2e
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r ../requirements-dev.lock
      - run: pip install --no-deps -e ..
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: vehinode_test
          POSTGRES_USER: vehinode
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vehinode -d vehinode_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      VEHINODE_DATABASE_URL: postgresql+psycopg://vehinode:test-password@localhost:5432/vehinode_test
      VEHINODE_TEST_DATABASE_URL: postgresql+psycopg://vehinode:test-password@localhost:5432/vehinode_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -m postgres backend/tests/test_postgres_integration.py

  docker:
    runs-on: ubuntu-latest
    needs: [python, frontend, docs, postgres, browser-e2e]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: vehinode:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose --env-file .env.example config --quiet
      - name: Smoke test image and migrations
        run: |
          docker network create vehinode-ci
          docker run -d --name vehinode-ci-postgres --network vehinode-ci -e POSTGRES_DB=vehinode -e POSTGRES_USER=vehinode -e POSTGRES_PASSWORD=test-password postgres:18.6-bookworm
          for attempt in $(seq 1 30); do
            docker exec vehinode-ci-postgres pg_isready -U vehinode -d vehinode && break
            [ "$attempt" -lt 30 ] || exit 1
            sleep 1
          done
          DATABASE_URL=postgresql+psycopg://vehinode:test-password@vehinode-ci-postgres:5432/vehinode
          docker run --rm --network vehinode-ci -e VEHINODE_DATABASE_URL="$DATABASE_URL" vehinode:ci alembic upgrade head
          docker run -d --name vehinode-ci-app --network vehinode-ci -p 127.0.0.1:18000:8000 \
            -e VEHINODE_DATABASE_URL="$DATABASE_URL" \
            -e VEHINODE_BOOTSTRAP_ADMIN_EMAIL=container-owner@example.com \
            -e VEHINODE_BOOTSTRAP_ADMIN_PASSWORD=container-bootstrap-password \
            -e VEHINODE_BOOTSTRAP_ADMIN_DISPLAY_NAME='Container Owner' \
            vehinode:ci
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18000/health/ready && break
            [ "$attempt" -lt 30 ] || exit 1
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/vehicles | grep -q '<title>VehiNode'
          curl --fail --silent -X POST http://127.0.0.1:18000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"email":"container-owner@example.com","password":"container-bootstrap-password"}' \
            | grep -q 'container-owner@example.com'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST \
            http://127.0.0.1:18000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            --data '{"email":"second@example.com","password":"second-container-password","display_name":"Second"}')" = 403
          docker run --rm --network vehinode-ci -e VEHINODE_DATABASE_URL="$DATABASE_URL" vehinode:ci python -m backend.app.worker --once
