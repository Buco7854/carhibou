name: Publish Pi agent artifact

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  wheel:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: python -m build --wheel --no-isolation
      - name: Verify version and create digest
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          test -f "dist/vehinode-${VERSION}-py3-none-any.whl"
          cd dist
          sha256sum "vehinode-${VERSION}-py3-none-any.whl" > "vehinode-${VERSION}-py3-none-any.whl.sha256"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.sha256 --clobber
