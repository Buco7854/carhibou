name: Publish standalone agent artifacts

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Test and build release matrix
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd agent
          go test ./...
          go vet ./...
          sh build-release.sh "$VERSION"
          test -f "dist/vehinode-agent-${VERSION}-linux-armv6"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" agent/dist/* --clobber
