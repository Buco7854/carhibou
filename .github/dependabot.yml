# Weekly, grouped: one PR per ecosystem for patch+minor keeps the noise at a
# level a single maintainer actually reviews. Majors stay individual PRs
# because they are the ones that need reading.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    groups:
      docs-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: weekly
      day: monday
    groups:
      go-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor:
        update-types: [minor, patch]
