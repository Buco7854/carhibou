# Weekly, grouped: one PR per ecosystem for patch+minor keeps the noise at a
# level a single maintainer actually reviews. Majors stay individual PRs
# because they are the ones that need reading.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    groups:
      docs-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: weekly
      day: monday
    groups:
      go-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Production follows the current Node LTS line. Dependabot otherwise proposes
    # the newer Current release as a major container update before it reaches LTS.
    ignore:
      - dependency-name: node
        versions: [">=25"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor:
        update-types: [minor, patch]
