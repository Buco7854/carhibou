x-app-environment: &app-environment
  CARHIBOU_ENVIRONMENT: ${CARHIBOU_ENVIRONMENT:-production}
  CARHIBOU_DATABASE_URL: postgresql+psycopg://carhibou:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/carhibou
  CARHIBOU_PUBLIC_URL: ${CARHIBOU_PUBLIC_URL:?Set CARHIBOU_PUBLIC_URL in .env}
  CARHIBOU_SESSION_COOKIE_SECURE: ${CARHIBOU_SESSION_COOKIE_SECURE:-true}
  CARHIBOU_SESSION_PEPPER: ${CARHIBOU_SESSION_PEPPER:?Set CARHIBOU_SESSION_PEPPER in .env}
  CARHIBOU_MASTER_KEY: ${CARHIBOU_MASTER_KEY:?Set CARHIBOU_MASTER_KEY in .env}
  CARHIBOU_MEDIA_DIR: /var/lib/carhibou/media
  CARHIBOU_BOOTSTRAP_ADMIN_EMAIL: ${CARHIBOU_BOOTSTRAP_ADMIN_EMAIL:-}
  CARHIBOU_BOOTSTRAP_ADMIN_PASSWORD: ${CARHIBOU_BOOTSTRAP_ADMIN_PASSWORD:-}
  CARHIBOU_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${CARHIBOU_BOOTSTRAP_ADMIN_DISPLAY_NAME:-Administrator}
  CARHIBOU_LOG_LEVEL: ${CARHIBOU_LOG_LEVEL:-INFO}

x-app-base: &app-base
  image: ${CARHIBOU_IMAGE:-ghcr.io/buco7854/carhibou:latest}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment: *app-environment

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: carhibou
      POSTGRES_USER: carhibou
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carhibou -d carhibou"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  app:
    <<: *app-base
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CARHIBOU_PORT:-8000}:8000"
    volumes:
      - vehicle-media:/var/lib/carhibou/media

  worker:
    <<: *app-base
    command: ["worker"]
    healthcheck:
      disable: true
    environment:
      <<: *app-environment
      CARHIBOU_WORKER_ID: worker-1
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  vehicle-media:
