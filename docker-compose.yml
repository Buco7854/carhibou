x-app-environment: &app-environment
  VEHINODE_ENVIRONMENT: ${VEHINODE_ENVIRONMENT:-production}
  VEHINODE_DATABASE_URL: postgresql+psycopg://vehinode:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/vehinode
  VEHINODE_PUBLIC_URL: ${VEHINODE_PUBLIC_URL:?Set VEHINODE_PUBLIC_URL in .env}
  VEHINODE_SESSION_COOKIE_SECURE: ${VEHINODE_SESSION_COOKIE_SECURE:-true}
  VEHINODE_SESSION_PEPPER: ${VEHINODE_SESSION_PEPPER:?Set VEHINODE_SESSION_PEPPER in .env}
  VEHINODE_MASTER_KEY: ${VEHINODE_MASTER_KEY:?Set VEHINODE_MASTER_KEY in .env}
  VEHINODE_BOOTSTRAP_ADMIN_EMAIL: ${VEHINODE_BOOTSTRAP_ADMIN_EMAIL:-}
  VEHINODE_BOOTSTRAP_ADMIN_PASSWORD: ${VEHINODE_BOOTSTRAP_ADMIN_PASSWORD:-}
  VEHINODE_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${VEHINODE_BOOTSTRAP_ADMIN_DISPLAY_NAME:-Administrator}
  VEHINODE_LOG_LEVEL: ${VEHINODE_LOG_LEVEL:-INFO}

x-app-base: &app-base
  image: ${VEHINODE_IMAGE:-ghcr.io/buco7854/vehinode:latest}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment: *app-environment

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: vehinode
      POSTGRES_USER: vehinode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehinode -d vehinode"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  app:
    <<: *app-base
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${VEHINODE_PORT:-8000}:8000"

  worker:
    <<: *app-base
    command: ["worker"]
    environment:
      <<: *app-environment
      VEHINODE_WORKER_ID: worker-1
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
